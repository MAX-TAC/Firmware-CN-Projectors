name: Audit ET32 Android partitions

on:
  push:
    paths:
      - ".github/workflows/audit_et32.yml"
      - "tools/reassemble_et32.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Filesystem dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq e2fsprogs
      - name: Get original update archive
        run: |
          curl -fL --retry 4 --retry-delay 5 \
            "https://github.com/MAX-TAC/Firmware-CN-Projectors/releases/download/Touyinger-ET32/YG_6M046.zip" \
            -o /tmp/YG_6M046.zip
          echo "df02237175428f2cede2290557f6de2cad2362a640e63c350816cf4ad40e586b  /tmp/YG_6M046.zip" | sha256sum --check
      - name: Reassemble sparse fragments and inspect Android
        run: |
          python3 tools/reassemble_et32.py /tmp/YG_6M046.zip
      - name: Commit small Android analysis reports
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/ET32/
          if ! git diff --cached --quiet; then
            git commit -m "Add ET32 Android system and vendor static audit"
            git push
          fi
      - name: Save audit as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: et32-android-audit
          path: analysis/ET32/
          retention-days: 30
